<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>小火车英语</title>
<style>
:root{--bg:#FBF8F2;--card:#FFFFFF;--ink:#2C2C2A;--muted:#6B6A64;--line:#E8E2D6;--blue:#185FA5;--blue-l:#E6F1FB;--red:#E24B4A;--green:#3B6D11;--green-l:#EAF3DE;--yellow:#EF9F27}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",sans-serif}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.wrap{max-width:980px;margin:0 auto;padding:18px 16px 48px}
/* 返回童趣学园导航页 */
.kg-back{display:inline-flex;align-items:center;margin:0 0 12px;padding:5px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--muted);font-size:13px;text-decoration:none}
.kg-back:hover{color:var(--blue);border-color:var(--blue)}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{font-size:28px;margin:0;letter-spacing:1px}
h1 span{color:var(--red)}
.sub{color:var(--muted);font-size:14px;margin-top:4px}
.speed{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.switch{width:46px;height:26px;border-radius:13px;background:#D3D1C7;position:relative;transition:.2s}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.switch.on{background:var(--green)}
.switch.on::after{left:23px}
.lane{position:relative;height:70px;margin:14px 0 6px;overflow:hidden;border-radius:14px;background:#EAF3DE}
.lane .sky{position:absolute;inset:0 0 18px 0;background:#E6F1FB}
.lane .hill{position:absolute;bottom:18px;width:160px;height:40px;border-radius:80px 80px 0 0;background:#C0DD97}
.lane .rail{position:absolute;left:0;right:0;bottom:12px;height:4px;background:#888780}
.lane .ties{position:absolute;left:0;right:0;bottom:8px;height:4px;background:repeating-linear-gradient(90deg,#854F0B 0 6px,transparent 6px 18px)}
.runner{position:absolute;bottom:13px;left:-200px;animation:run 11s linear infinite}
@keyframes run{to{left:100%}}
.puff{animation:puff 1.2s ease-out infinite;transform-origin:center}
@keyframes puff{0%{opacity:.9;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(-14px,-16px) scale(1.3)}}
.progress{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);margin-bottom:14px}
.bar{flex:1;height:8px;border-radius:4px;background:#E8E2D6;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--yellow);border-radius:4px;transition:width .4s}
.tabs{display:flex;background:#EFEAE0;border-radius:14px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;padding:11px 0;border-radius:11px;font-size:16px;font-weight:600;color:var(--muted)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:14px;color:var(--muted)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.bigbtn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;background:var(--blue-l);color:var(--blue);font-size:14px;font-weight:600;flex:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 10px 12px;text-align:center;user-select:none;transition:transform .15s}
.card:active{transform:scale(.96)}
.card.bounce{animation:bounce .5s}
@keyframes bounce{30%{transform:scale(1.06) rotate(-2deg)}60%{transform:scale(.98) rotate(1deg)}}
.pic{border-radius:14px;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;padding:10%}
.pic svg{width:100%;height:100%}
.word{font-size:19px;font-weight:700;margin-top:8px;letter-spacing:.3px}
.zh{font-size:13px;color:var(--muted);margin-top:2px}
.heard{position:absolute;top:8px;left:8px;width:22px;height:22px;opacity:0;transition:.3s}
.card.done .heard{opacity:1}
.zoom{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center}
.zoom svg{width:16px;height:16px}
.mask{position:fixed;inset:0;background:rgba(44,44,42,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.mask.show{display:flex}
.panel{background:#fff;border-radius:24px;width:100%;max-width:440px;padding:18px 18px 20px;position:relative;text-align:center}
.panel .pic{width:min(240px,62vw);margin:6px auto 0;padding:8%}
.close{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;background:#F1EFE8;font-size:20px;line-height:36px}
.dword{font-size:36px;font-weight:800;margin-top:12px}
.ipa{font-family:"Lucida Sans Unicode","Arial Unicode MS",sans-serif;color:var(--muted);font-size:16px;margin-top:2px}
.dzh{font-size:18px;color:var(--blue);margin-top:4px;font-weight:600}
.row{display:flex;justify-content:center;gap:10px;margin-top:14px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:999px;font-size:15px;font-weight:600}
.pill svg{width:18px;height:18px}
.pill.main{background:var(--ink);color:#fff}
.pill.soft{background:#F1EFE8}
.sent{margin-top:16px;background:#FBF8F2;border-radius:14px;padding:12px 14px;text-align:left;display:flex;gap:12px;align-items:center}
.sent .t{flex:1}
.sent .en{font-size:16px;font-weight:600}
.sent .cn{font-size:13px;color:var(--muted);margin-top:2px}
.sent button{width:40px;height:40px;border-radius:50%;background:#fff;border:1px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center}
.sent button svg{width:18px;height:18px}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:14px;color:var(--muted);font-size:13px}
.nav button{width:44px;height:44px;border-radius:50%;background:#F1EFE8;font-size:22px}
.quiz{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px}
.qlane{position:relative;height:96px;border-radius:14px;background:#E6F1FB;overflow:hidden}
.qlane .ground{position:absolute;left:0;right:0;bottom:0;height:22px;background:#C0DD97}
.qlane .rail{position:absolute;left:0;right:0;bottom:16px;height:4px;background:#888780}
.qtrain{position:absolute;left:8px;right:10px;bottom:20px;display:flex;flex-direction:row-reverse;align-items:flex-end;gap:3px;transition:transform 2.8s cubic-bezier(.55,0,.85,.35)}
.qtrain.go{transform:translateX(120vw)}
.qengine{flex:none;width:72px;height:56px;transform:scaleX(-1)}
.qengine svg{width:100%;height:100%}
.car{flex:0 1 40px;min-width:20px;height:34px;border-radius:6px;position:relative;display:flex;align-items:center;justify-content:center;margin-bottom:4px;animation:hook .45s ease-out}
.car::before,.car::after{content:"";position:absolute;bottom:-6px;width:9px;height:9px;border-radius:50%;background:#2C2C2A}
.car::before{left:4px}.car::after{right:4px}
.car .ic{width:72%;max-width:26px;aspect-ratio:1/1;background:#fff;border-radius:5px;padding:2px}
.car .ic svg{width:100%;height:100%}
@keyframes hook{from{transform:translateX(-30px);opacity:0}to{transform:none;opacity:1}}
.qhead{display:flex;justify-content:space-between;align-items:center;margin:14px 0 10px;gap:10px}
.qcount{font-size:14px;color:var(--muted)}
.qcount b{color:var(--ink);font-size:18px}
.listen{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:999px;background:var(--red);color:#fff;font-size:17px;font-weight:700}
.listen svg{width:22px;height:22px}
.listen.pulse{animation:pulse 1s ease-out}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(226,75,74,.5)}100%{box-shadow:0 0 0 18px rgba(226,75,74,0)}}
.opts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:620px){.opts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.opt{border:3px solid transparent;border-radius:18px;padding:6px;background:#FBF8F2;transition:transform .15s}
.opt:active{transform:scale(.96)}
.opt .pic{padding:12%}
.opt .lab{height:22px;font-size:16px;font-weight:700;margin-top:4px;opacity:0}
.opt.right{border-color:#639922;background:#EAF3DE}
.opt.wrong{border-color:#E24B4A;animation:shake .4s}
.opts.revealed .lab{opacity:1}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.qstart,.qend{text-align:center;padding:18px 8px 8px}
.qstart p,.qend p{color:var(--muted);font-size:15px;line-height:1.7;margin:8px 0 14px}
.qend h2{font-size:24px;margin:6px 0 0}
.stars{display:flex;justify-content:center;gap:6px;margin-top:6px}
.stars svg{width:44px;height:44px}
.go-btn{padding:13px 30px;border-radius:999px;background:var(--ink);color:#fff;font-size:17px;font-weight:700}
.scope{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:16px}
@media (max-width:520px){
.wrap{padding:14px 12px 40px}
h1{font-size:24px}
.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.word{font-size:17px}
.opts{gap:10px}
.qhead{flex-wrap:wrap}
.car{flex-basis:34px;height:30px}
.qengine{width:62px;height:48px}
}
.foot{margin-top:28px;font-size:12px;color:#9A988F;text-align:center;line-height:1.7}
.hide{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <a class="kg-back" href="/kidgame/">‹ 全部游戏</a>
  <div class="top">
    <div>
      <h1>小火车<span>英语</span></h1>
      <div class="sub">火车迷最常用的 <span id="total">40</span> 个词，点一点就能听</div>
    </div>
    <div class="speed">慢速朗读 <button class="switch" id="slowSw" aria-label="慢速朗读"></button></div>
  </div>

  <div class="lane" aria-hidden="true">
    <div class="sky"></div>
    <div class="hill" style="left:8%"></div><div class="hill" style="left:46%;width:220px;height:52px"></div><div class="hill" style="left:80%"></div>
    <div class="ties"></div><div class="rail"></div>
    <div class="runner" id="runner"></div>
  </div>

  <div class="progress"><span id="progTxt">已听过 0</span><div class="bar"><i id="progBar"></i></div></div>

  <div class="tabs">
    <button class="on" data-tab="learn">认识单词</button>
    <button data-tab="quiz">听音选图</button>
  </div>

  <section id="learn">
    <div class="chips" id="chips"></div>
    <div class="grid" id="grid"></div>
  </section>

  <section id="quiz" class="hide">
    <div class="quiz">
      <div class="qlane"><div class="ground"></div><div class="rail"></div><div class="qtrain" id="qtrain"><div class="qengine" id="qengine"></div></div></div>
      <div id="qstart" class="qstart">
        <p>听到单词后，点出对的图片。<br>每答对一题，小火车就多挂一节车厢。</p>
        <div class="scope" id="scope"></div>
        <button class="go-btn" id="startBtn">开始 10 道题</button>
      </div>
      <div id="qplay" class="hide">
        <div class="qhead">
          <div class="qcount">第 <b id="qi">1</b> / 10 题 · 已挂 <b id="qc">0</b> 节</div>
          <button class="listen" id="listenBtn"></button>
        </div>
        <div class="opts" id="opts"></div>
      </div>
      <div id="qend" class="qend hide">
        <div class="stars" id="stars"></div>
        <h2 id="endTitle"></h2>
        <p id="endTxt"></p>
        <button class="go-btn" id="againBtn">再玩一次</button>
      </div>
    </div>
  </section>

  <div class="foot">单词发音为美式读音，来自有道词典；网络不通时改用浏览器自带朗读。<br>听过的单词会打上小星星，记录保存在本机浏览器里。</div>
</div>

<div class="mask" id="mask">
  <div class="panel" id="panel">
    <button class="close" id="closeBtn" aria-label="关闭">×</button>
    <div class="pic" id="dpic"></div>
    <div class="dword" id="dword"></div>
    <div class="ipa" id="dipa"></div>
    <div class="dzh" id="dzh"></div>
    <div class="row">
      <button class="pill main" id="dplay"></button>
      <button class="pill soft" id="dslow"></button>
    </div>
    <div class="sent">
      <div class="t"><div class="en" id="sen"></div><div class="cn" id="scn"></div></div>
      <button id="splay" aria-label="听句子"></button>
    </div>
    <div class="nav"><button id="prevBtn" aria-label="上一个">‹</button><span id="dpos"></span><button id="nextBtn" aria-label="下一个">›</button></div>
  </div>
</div>

<script>
const K='#2C2C2A',D='#444441',GR='#888780',GL='#D3D1C7',R='#E24B4A',RD='#A32D2D',RL='#FCEBEB',B='#378ADD',BD='#185FA5',BL='#E6F1FB',BM='#B5D4F4',Y='#EF9F27',YD='#BA7517',YL='#FAEEDA',YM='#FAC775',G='#639922',GD='#3B6D11',GLL='#EAF3DE',GM='#97C459',SK='#F5C4B3',BR='#854F0B';
const wh=(x,y,r=7)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${K}"/><circle cx="${x}" cy="${y}" r="${(r*.4).toFixed(1)}" fill="${GL}"/>`;
const rail=(y=86)=>`<rect x="4" y="${y}" width="92" height="3" rx="1.5" fill="${GR}"/>`;
const radial=(n,r1,r2,stroke,w,cap='round')=>{let s='';for(let i=0;i<n;i++){const a=i*2*Math.PI/n;s+=`<line x1="${(50+r1*Math.cos(a)).toFixed(1)}" y1="${(50+r1*Math.sin(a)).toFixed(1)}" x2="${(50+r2*Math.cos(a)).toFixed(1)}" y2="${(50+r2*Math.sin(a)).toFixed(1)}" stroke="${stroke}" stroke-width="${w}" stroke-linecap="${cap}"/>`}return s};
const ties=()=>{let s='';for(let k=0;k<7;k++){const y=30+k*10,h=11+(y-30)*.378+6;s+=`<rect x="${(50-h).toFixed(1)}" y="${y}" width="${(2*h).toFixed(1)}" height="${(3+k*.6).toFixed(1)}" rx="1" fill="${BR}"/>`}return s};
const colorTrain=(c,cd,cl)=>`<rect x="10" y="36" width="52" height="36" rx="6" fill="${c}"/><rect x="20" y="22" width="10" height="16" fill="${cd}"/><rect x="17" y="19" width="16" height="5" rx="2" fill="${cd}"/><rect x="56" y="24" width="34" height="48" rx="5" fill="${c}"/><rect x="52" y="20" width="42" height="6" rx="3" fill="${cd}"/><rect x="63" y="31" width="20" height="14" rx="3" fill="${cl}"/><rect x="6" y="70" width="88" height="5" rx="2" fill="${K}"/>${wh(22,80,8)}${wh(46,80,8)}${wh(74,80,8)}`;

const SVG={
train:`<rect x="6" y="38" width="42" height="36" rx="6" fill="${B}"/><rect x="12" y="44" width="16" height="14" rx="3" fill="${BL}"/><rect x="32" y="44" width="10" height="14" rx="2" fill="${BL}"/><rect x="6" y="64" width="42" height="4" fill="${BD}"/><rect x="47" y="63" width="8" height="3" fill="${K}"/><rect x="54" y="42" width="40" height="32" rx="5" fill="${Y}"/><rect x="59" y="48" width="12" height="11" rx="2" fill="${YL}"/><rect x="76" y="48" width="12" height="11" rx="2" fill="${YL}"/>${wh(17,78)}${wh(37,78)}${wh(64,78)}${wh(84,78)}${rail()}`,
engine:`<rect x="58" y="28" width="30" height="44" rx="4" fill="${R}"/><rect x="54" y="24" width="38" height="6" rx="2" fill="${K}"/><rect x="64" y="34" width="18" height="14" rx="2" fill="${RL}"/><rect x="12" y="44" width="48" height="26" rx="10" fill="${R}"/><rect x="20" y="30" width="9" height="16" fill="${K}"/><rect x="17" y="27" width="15" height="5" rx="2" fill="${K}"/><rect x="38" y="37" width="10" height="9" rx="4.5" fill="${Y}"/><circle cx="12" cy="56" r="5" fill="${YM}"/><rect x="6" y="66" width="86" height="6" rx="2" fill="${K}"/>${wh(24,78,8)}${wh(46,78,8)}${wh(74,78,8)}${rail()}`,
car:`<rect x="8" y="34" width="84" height="40" rx="7" fill="${G}"/><rect x="8" y="34" width="84" height="7" rx="3" fill="${GD}"/><rect x="15" y="46" width="14" height="14" rx="2" fill="${GLL}"/><rect x="35" y="46" width="14" height="14" rx="2" fill="${GLL}"/><rect x="55" y="46" width="14" height="14" rx="2" fill="${GLL}"/><rect x="74" y="46" width="12" height="24" rx="2" fill="${GD}"/><rect x="76" y="49" width="8" height="8" rx="1" fill="${GLL}"/>${wh(22,78)}${wh(36,78)}${wh(64,78)}${wh(78,78)}${rail()}`,
steamtrain:`<circle cx="22" cy="23" r="7" fill="${GL}" class="puff"/><circle cx="33" cy="14" r="9" fill="${GL}"/><circle cx="47" cy="10" r="7" fill="${GL}"/><rect x="18" y="28" width="8" height="15" fill="${K}"/><rect x="8" y="42" width="34" height="22" rx="8" fill="${D}"/><rect x="38" y="32" width="20" height="34" rx="3" fill="${D}"/><rect x="42" y="37" width="12" height="10" rx="2" fill="${YM}"/><rect x="6" y="62" width="54" height="5" fill="${R}"/><rect x="62" y="40" width="32" height="26" rx="4" fill="${R}"/><rect x="66" y="45" width="10" height="9" rx="1.5" fill="${RL}"/><rect x="80" y="45" width="10" height="9" rx="1.5" fill="${RL}"/>${wh(17,74,7)}${wh(33,74,7)}${wh(50,74,6)}${wh(70,74,6)}${wh(86,74,6)}${rail(82)}`,
bullet:`<path d="M6 70 Q8 46 40 40 L94 40 L94 70 Z" fill="#fff" stroke="#B4B2A9" stroke-width="1.5"/><path d="M17 51 Q25 44 40 43 L40 52 L16 55 Z" fill="${BD}"/><rect x="46" y="46" width="10" height="8" rx="2" fill="${BM}"/><rect x="60" y="46" width="10" height="8" rx="2" fill="${BM}"/><rect x="74" y="46" width="10" height="8" rx="2" fill="${BM}"/><path d="M7 63 L94 59 L94 64 L7 67 Z" fill="${B}"/><rect x="10" y="70" width="84" height="5" fill="#B4B2A9"/>${rail(80)}`,
subway:`<path d="M4 94 L4 42 Q50 -2 96 42 L96 94 Z" fill="${GL}"/><rect x="22" y="22" width="56" height="62" rx="10" fill="${B}"/><rect x="40" y="26" width="20" height="6" rx="1.5" fill="${Y}"/><rect x="28" y="36" width="44" height="22" rx="4" fill="${BL}"/><rect x="48" y="36" width="4" height="22" fill="${B}"/><circle cx="32" cy="70" r="4" fill="${YM}"/><circle cx="68" cy="70" r="4" fill="${YM}"/><rect x="22" y="78" width="56" height="6" fill="${BD}"/><path d="M36 84 L28 96 M64 84 L72 96" stroke="${K}" stroke-width="3"/>`,
tram:`<line x1="4" y1="10" x2="96" y2="10" stroke="${K}" stroke-width="1.5"/><path d="M50 27 L62 11" stroke="${K}" stroke-width="2.5"/><rect x="20" y="24" width="60" height="7" rx="3" fill="${YD}"/><rect x="10" y="30" width="80" height="44" rx="8" fill="${Y}"/><rect x="16" y="38" width="14" height="15" rx="2" fill="${YL}"/><rect x="34" y="38" width="14" height="15" rx="2" fill="${YL}"/><rect x="52" y="38" width="14" height="15" rx="2" fill="${YL}"/><rect x="70" y="38" width="14" height="15" rx="2" fill="${YL}"/><rect x="10" y="60" width="80" height="4" fill="${R}"/>${wh(28,78,6)}${wh(72,78,6)}<rect x="4" y="84" width="92" height="3" fill="${GR}"/>`,

['level crossing','/ˌlevəl ˈkrɔːsɪŋ/','道口','Stop and wait at the level crossing.','在道口停下来等一等。','rail','crossing'],
['station','/ˈsteɪʃən/','车站','We are at the station.','我们到车站了。','rail','station'],
['platform','/ˈplætfɔːrm/','站台','Wait on the platform.','在站台上等车。','rail','platform'],
['ticket','/ˈtɪkɪt/','车票','Here is my ticket.','这是我的车票。','rail','ticket'],
['clock','/klɑːk/','时钟','Look at the clock.','看看时钟。','rail','clock'],
['depot','/ˈdiːpoʊ/','机务段','The trains rest in the depot at night.','晚上火车回机务段休息。','rail','depot'],
['driver','/ˈdraɪvər/','司机','The driver waves to me.','司机向我挥手。','act','driver'],
['passenger','/ˈpæsɪndʒər/','乘客','I am a passenger.','我是一名乘客。','act','passenger'],
['choo-choo','/ˈtʃuː tʃuː/','呜呜（火车声）','Choo-choo! Here it comes.','呜呜！火车来啦。','fun','choo'],
['toot toot','/tuːt tuːt/','嘟嘟（喇叭声）','Toot toot! Hello!','嘟嘟！你好！','fun','toot'],
['all aboard','/ˌɔːl əˈbɔːrd/','请上车','All aboard! Let\'s go!','请上车！出发啦！','fun','aboard']
].map((a,i)=>({i,w:a[0],ipa:a[1],zh:a[2],s:a[3],sz:a[4],cat:a[5],svg:SVG[a[6]]}));
const catBg=k=>CATS.find(c=>c.k===k).bg;
const svgOf=(w)=>`<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">${w.svg}</svg>`;
const ICON={
play:`<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>`,
snail:`<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="14" cy="12" r="6"/><path d="M2 19h18v2H4a2 2 0 0 1-2-2zM4 13l-1-4 1.5-.3L5.5 12H8v7H4z"/></svg>`,
zoom:`<svg viewBox="0 0 24 24" fill="none" stroke="#5F5E5A" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21M10.5 7.5v6M7.5 10.5h6"/></svg>`,
star:(on)=>`<svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5-4.8-4.6 6.6-.9z" fill="${on?'#EF9F27':'#E8E2D6'}"/></svg>`
};

/* 发音 */
let slow=localStorage.getItem('tr-slow')==='1',ttsOnly=false,fails=0;
const player=new Audio();player.preload='auto';
function tts(t){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=slow?.7:.95;const v=speechSynthesis.getVoices().find(v=>/^en[-_]US/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u)}
function speak(text){
  const t=text.replace(/-/g,' ');
  if(ttsOnly){tts(t);return}
  let fell=false;const fb=()=>{if(fell)return;fell=true;if(++fails>=2)ttsOnly=true;tts(t)};
  const r=slow?.72:1;
  player.onerror=fb;
  player.onloadedmetadata=()=>{player.playbackRate=r};
  player.src='https://dict.youdao.com/dictvoice?type=2&audio='+encodeURIComponent(t);
  player.defaultPlaybackRate=r;player.playbackRate=r;
  const p=player.play();if(p&&p.catch)p.catch(e=>{if(e&&e.name==='NotAllowedError')return;fb()});
}
let ac;
function tone(ok){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();const n=ac.currentTime;(ok?[[660,0],[990,.12]]:[[240,0],[190,.16]]).forEach(([f,d])=>{const o=ac.createOscillator(),g=ac.createGain();o.type=ok?'sine':'triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,n+d);g.gain.exponentialRampToValueAtTime(ok?.3:.2,n+d+.02);g.gain.exponentialRampToValueAtTime(.0001,n+d+.28);o.connect(g);g.connect(ac.destination);o.start(n+d);o.stop(n+d+.32)})}catch(e){}}

/* 听过记录 */
let heard=new Set(JSON.parse(localStorage.getItem('tr-heard')||'[]').filter(x=>W.some(w=>w.w===x)));
function markHeard(w){if(heard.has(w.w))return;heard.add(w.w);localStorage.setItem('tr-heard',JSON.stringify([...heard]));const c=document.querySelector(`.card[data-i="${w.i}"]`);if(c)c.classList.add('done');renderProg()}
function renderProg(){document.getElementById('progTxt').textContent=`已听过 ${heard.size} / ${W.length}`;document.getElementById('progBar').style.width=(heard.size/W.length*100)+'%'}

/* 顶部小火车 */
document.getElementById('runner').innerHTML=`<svg width="190" height="50" viewBox="0 0 190 50"><g transform="translate(190 0) scale(-1 1)"><circle cx="20" cy="6" r="5" fill="#fff" class="puff"/><rect x="16" y="9" width="7" height="11" fill="${K}"/><rect x="6" y="18" width="34" height="18" rx="6" fill="${B}"/><rect x="34" y="8" width="20" height="28" rx="3" fill="${B}"/><rect x="31" y="5" width="26" height="5" rx="2" fill="${BD}"/><rect x="38" y="13" width="12" height="9" rx="2" fill="${BL}"/><rect x="58" y="14" width="40" height="22" rx="4" fill="${R}"/><rect x="62" y="18" width="10" height="8" rx="1.5" fill="${RL}"/><rect x="76" y="18" width="10" height="8" rx="1.5" fill="${RL}"/><rect x="102" y="14" width="40" height="22" rx="4" fill="${Y}"/><rect x="106" y="18" width="10" height="8" rx="1.5" fill="${YL}"/><rect x="120" y="18" width="10" height="8" rx="1.5" fill="${YL}"/><rect x="146" y="14" width="40" height="22" rx="4" fill="${G}"/><rect x="150" y="18" width="10" height="8" rx="1.5" fill="${GLL}"/><rect x="164" y="18" width="10" height="8" rx="1.5" fill="${GLL}"/>${[14,30,46,66,90,110,134,154,178].map(x=>`<circle cx="${x}" cy="40" r="5" fill="${K}"/>`).join('')}</g></svg>`;

/* 认识单词 */
let cat='all';
const chips=document.getElementById('chips'),grid=document.getElementById('grid');
function list(){return cat==='all'?W:W.filter(w=>w.cat===cat)}
function renderChips(){
  chips.innerHTML=`<button class="bigbtn" id="bigMode">${ICON.zoom.replace('#5F5E5A','#185FA5')}大卡片</button>`+[{k:'all',n:'全部 '+W.length}].concat(CATS.map(c=>({k:c.k,n:c.n}))).map(c=>`<button class="chip ${c.k===cat?'on':''}" data-k="${c.k}">${c.n}</button>`).join('');
  chips.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{cat=b.dataset.k;renderChips();renderGrid()});
  document.getElementById('bigMode').onclick=()=>openDetail(0);
  document.querySelector('#bigMode svg').setAttribute('style','width:16px;height:16px');
}
function renderGrid(){
  grid.innerHTML=list().map(w=>`<div class="card ${heard.has(w.w)?'done':''}" data-i="${w.i}"><span class="heard">${ICON.star(true)}</span><button class="zoom" aria-label="放大">${ICON.zoom}</button><div class="pic" style="background:${catBg(w.cat)}">${svgOf(w)}</div><div class="word">${w.w}</div><div class="zh">${w.zh}</div></div>`).join('');
  grid.querySelectorAll('.card').forEach(c=>{
    const w=W[+c.dataset.i];
    c.onclick=e=>{
      if(e.target.closest('.zoom')){openDetail(list().indexOf(w));return}
      speak(w.w);markHeard(w);c.classList.remove('bounce');void c.offsetWidth;c.classList.add('bounce');
    };
  });
}

/* 大卡片 */
const mask=document.getElementById('mask');let di=0;
function openDetail(i){di=i;showDetail();mask.classList.add('show')}
function showDetail(){
  const L=list(),w=L[di];
  const pic=document.getElementById('dpic');pic.style.background=catBg(w.cat);pic.innerHTML=svgOf(w);
  document.getElementById('dword').textContent=w.w;
  document.getElementById('dipa').textContent=w.ipa;
  document.getElementById('dzh').textContent=w.zh;
  document.getElementById('sen').textContent=w.s;
  document.getElementById('scn').textContent=w.sz;
  document.getElementById('dpos').textContent=`${di+1} / ${L.length}`;
  speak(w.w);markHeard(w);
}
function step(d){const L=list();di=(di+d+L.length)%L.length;showDetail()}
document.getElementById('dplay').innerHTML=ICON.play+'再听一次';
document.getElementById('dslow').innerHTML=ICON.snail+'慢慢读';
document.getElementById('splay').innerHTML=ICON.play;
document.getElementById('dplay').onclick=()=>speak(list()[di].w);
document.getElementById('dslow').onclick=()=>{const o=slow;slow=true;speak(list()[di].w);slow=o};
document.getElementById('splay').onclick=()=>speak(list()[di].s);
document.getElementById('dpic').onclick=()=>speak(list()[di].w);
document.getElementById('prevBtn').onclick=()=>step(-1);
document.getElementById('nextBtn').onclick=()=>step(1);
document.getElementById('closeBtn').onclick=()=>mask.classList.remove('show');
mask.onclick=e=>{if(e.target===mask)mask.classList.remove('show')};
document.addEventListener('keydown',e=>{if(!mask.classList.contains('show'))return;if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1);if(e.key==='Escape')mask.classList.remove('show')});
let tx=null;const panel=document.getElementById('panel');
panel.addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
panel.addEventListener('touchend',e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>50)step(dx<0?1:-1);tx=null});

/* 慢速开关 */
const sw=document.getElementById('slowSw');
function renderSw(){sw.classList.toggle('on',slow)}
sw.onclick=()=>{slow=!slow;localStorage.setItem('tr-slow',slow?'1':'0');renderSw()};

/* 标签切换 */
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  document.getElementById('learn').classList.toggle('hide',b.dataset.tab!=='learn');
  document.getElementById('quiz').classList.toggle('hide',b.dataset.tab!=='quiz');
});

/* 听音选图 */
const Q={scope:'all',items:[],i:0,ok:0,lock:false};
const CAR_COLORS=[R,Y,G,'#7F77DD',B,'#D4537E'];
const qtrain=document.getElementById('qtrain');
document.getElementById('qengine').innerHTML=`<svg viewBox="0 0 100 100">${colorTrain(B,BD,BL)}</svg>`;
document.getElementById('listenBtn').innerHTML=ICON.play+'听一听';
function renderScope(){
  const s=document.getElementById('scope');
  s.innerHTML=[{k:'all',n:'全部 '+W.length+' 词'}].concat(CATS.map(c=>({k:c.k,n:c.n}))).map(c=>`<button class="chip ${c.k===Q.scope?'on':''}" data-k="${c.k}">${c.n}</button>`).join('');
  s.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{Q.scope=b.dataset.k;renderScope()});
}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function startQuiz(){
  const pool=Q.scope==='all'?W:W.filter(w=>w.cat===Q.scope);
  let items=shuffle(pool);while(items.length<10)items=items.concat(shuffle(pool));
  Q.items=items.slice(0,10);Q.i=0;Q.ok=0;
  qtrain.classList.remove('go');qtrain.style.transition='none';qtrain.querySelectorAll('.car').forEach(c=>c.remove());void qtrain.offsetWidth;qtrain.style.transition='';
  show('qplay');round();
}
function show(id){['qstart','qplay','qend'].forEach(x=>document.getElementById(x).classList.toggle('hide',x!==id))}
function round(){
  Q.lock=false;const ans=Q.items[Q.i];
  const others=shuffle(W.filter(w=>w!==ans)).slice(0,3);
  const opts=shuffle([ans,...others]);
  document.getElementById('qi').textContent=Q.i+1;
  document.getElementById('qc').textContent=Q.ok;
  const box=document.getElementById('opts');box.classList.remove('revealed');
  box.innerHTML=opts.map(w=>`<button class="opt" data-i="${w.i}"><div class="pic" style="background:${catBg(w.cat)}">${svgOf(w)}</div><div class="lab">${w.w}</div></button>`).join('');
  box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(b,ans));
  setTimeout(()=>sayQ(),250);
}
function sayQ(){const b=document.getElementById('listenBtn');b.classList.remove('pulse');void b.offsetWidth;b.classList.add('pulse');speak(Q.items[Q.i].w)}
document.getElementById('listenBtn').onclick=sayQ;
function pick(btn,ans){
  if(Q.lock)return;Q.lock=true;
  const box=document.getElementById('opts');
  const right=+btn.dataset.i===ans.i;
  box.querySelector(`.opt[data-i="${ans.i}"]`).classList.add('right');
  box.classList.add('revealed');markHeard(ans);
  if(right){tone(true);Q.ok++;addCar(ans);document.getElementById('qc').textContent=Q.ok}
  else{tone(false);btn.classList.add('wrong');setTimeout(()=>speak(ans.w),450)}
  setTimeout(next,right?1100:2200);
}
function addCar(w){
  const c=document.createElement('div');c.className='car';c.style.background=CAR_COLORS[(Q.ok-1)%CAR_COLORS.length];
  c.innerHTML=`<div class="ic">${svgOf(w)}</div>`;qtrain.appendChild(c);
}
function next(){Q.i++;if(Q.i<10)round();else finish()}
function finish(){
  const n=Q.ok,stars=n>=9?3:n>=6?2:n>=1?1:0;
  document.getElementById('stars').innerHTML=[0,1,2].map(i=>ICON.star(i<stars)).join('');
  document.getElementById('endTitle').textContent=n>=9?'Great job!':n>=6?'Well done!':'Good try!';
  document.getElementById('endTxt').innerHTML=n>0?`小火车挂上了 <b>${n}</b> 节车厢，出发啦！`:'这次一节也没挂上，先去「认识单词」里多听几遍吧。';
  show('qend');
  if(n>0){setTimeout(()=>{speak('All aboard!');qtrain.classList.add('go')},400)}
}
document.getElementById('startBtn').onclick=startQuiz;
document.getElementById('againBtn').onclick=()=>{qtrain.style.transition='none';qtrain.classList.remove('go');qtrain.querySelectorAll('.car').forEach(c=>c.remove());void qtrain.offsetWidth;qtrain.style.transition='';show('qstart')};

if('speechSynthesis' in window){speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}
document.getElementById('total').textContent=W.length;renderSw();renderChips();renderGrid();renderScope();renderProg();
</script>
</body>
